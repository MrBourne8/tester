name: Tauri cross-platform build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src-tauri/**'
      - 'resources/js/player/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tauri-build.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'resources/js/player/**'
      - 'package.json'
      - '.github/workflows/tauri-build.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: ''
          - platform: ubuntu-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm deps
        run: npm ci

      - name: Build frontend + standalone
        run: npm run build

      - name: Build Tauri
        run: npm run tauri:build

      - name: Publish native player for server deploy
        run: |
          case "${{ matrix.platform }}" in
            windows-latest) npm run native:windows:publish ;;
            macos-latest) npm run native:macos:publish ;;
            ubuntu-latest) npm run native:linux:publish ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unitest-player-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle
            src-tauri/target/release/unitest-player
            src-tauri/target/release/unitest-player.exe
            src-tauri/target/release/resources
          if-no-files-found: warn

      - name: Upload Windows dist for server
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: unitest-player-windows-dist
          path: dist/native/windows/
          if-no-files-found: error

      - name: Upload macOS dist for server
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: unitest-player-macos-dist
          path: dist/native/macos/
          if-no-files-found: error

      - name: Upload Linux dist for server
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: unitest-player-linux-dist
          path: dist/native/linux/
          if-no-files-found: error
