name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  php-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, openssl, zip, json, fileinfo
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Composer
        run: composer install --no-interaction --prefer-dist

      - name: npm ci + vitest
        run: |
          npm ci
          npm test

      - name: PHPUnit (unit only without MySQL)
        run: vendor/bin/phpunit --testsuite Unit
        continue-on-error: true
